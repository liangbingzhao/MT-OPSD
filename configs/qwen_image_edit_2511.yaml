# MT-OPSD on Qwen-Image-Edit-2511 (paper main model).
# 4 GPUs, ~2000 samples; train together with the gate worker (gate_promote: true):
#   bash scripts/train.sh configs/qwen_image_edit_2511.yaml
#   bash scripts/gate_worker.sh <output_dir>          # separate job, 1-2 GPUs + OPENAI_API_KEY
model: qwen-image-edit-2511
pretrained_path: null                # null -> Qwen/Qwen-Image-Edit-2511 from the HF hub
train_area: 262144                   # 512 x 512 working area (keep the same at inference)

data_root: /path/to/OmniEdit-Filtered-1.2M
output_dir: outputs/qwen_image_edit_2511

rank: 32
lora_alpha: 64
target_modules: [to_q, to_k, to_v, add_q_proj, add_k_proj, add_v_proj, to_out.0, to_add_out,
                 img_mlp.net.2, img_mod.1, txt_mlp.net.2, txt_mod.1]

lr: 3.0e-4
max_steps: 2000                      # global samples (500 optimizer steps on 4 GPUs)
max_grad_norm: 1.0

rollout_steps: 30
rollout_cfg: 4.0
noop_prompt: "make everything unchange"

edit_ratio: 0.667                    # editing : identity = 2 : 1
noop_loss_scale: 10

opd_steps: 10
opd_cfg: 4.0
opd_k: 2
opd_query_bias: mid_t

turns_curriculum: true
turns_curriculum_init: 2
turns_curriculum_max: 10
turns_curriculum_drift: 9.0
turns_curriculum_patience: 10

gate_promote: true
gate_sr_bar: 2
gate_col_unlock: 5

eval_every: 50
drift_steps: 30
mt_eval: true                        # sentinel sessions, plain vs Emu-thresholded (monitoring only)
save_every: 50
log_every: 10
seed: 42
